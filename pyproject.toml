[project]
name = "jev-firewall"
version = "0.1.1"
description = "Runtime action firewall for AI agents, powered by TypeSafe's Jev System One model."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Ahsan Shah" }]
keywords = ["ai-agents", "guardrails", "firewall", "jev", "typesafe", "langgraph", "langchain", "openai-agents", "google-adk", "semantic-kernel", "prompt-injection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "typesafe-sdk>=0.7.2,<0.8",
    "httpx2>=2.13.1",
    "pydantic>=2.13",
    "pyyaml>=6.0.3",
]

[project.urls]
Homepage = "https://github.com/realahsanshah/jev-action-firewall"
Repository = "https://github.com/realahsanshah/jev-action-firewall"
Documentation = "https://github.com/realahsanshah/jev-action-firewall/blob/master/README.md"
Issues = "https://github.com/realahsanshah/jev-action-firewall/issues"
Changelog = "https://github.com/realahsanshah/jev-action-firewall/blob/master/CHANGELOG.md"

[project.optional-dependencies]
langgraph = ["langgraph>=1.2.12", "langchain-core>=1.6.5"]
langchain = ["langchain-core>=1.6.5", "langchain>=1.4.2"]
openai_sdk = ["openai-agents>=0.22.3"]
google_adk = ["google-adk>=2.10.0"]
semantic_kernel = ["semantic-kernel>=1.44.1", "azure-ai-agents>=1.2.0b3"]
all = ["jev-firewall[langgraph,langchain,openai_sdk,google_adk,semantic_kernel]"]

[project.scripts]
jev-firewall = "jev_firewall.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "ruff>=0.8",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_firewall"]

[tool.hatch.build.targets.wheel.force-include]
"policy.example.yaml" = "jev_firewall/policy.example.yaml"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "benchmarks", "docs", "scripts", "policy.example.yaml", "README.md", "CHANGELOG.md", "LICENSE"]
exclude = ["docs/jev-action-firewall-prd-and-trd.md", "docs/PLAN.md", "benchmarks/results/raw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls the real Jev API (needs JEV_LIVE_TESTS=1)"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]
ignore = ["E501"]  # the formatter owns line length

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PT018"]

[tool.mypy]
# 3.12: third-party stubs (numpy, via frameworks) use 3.12 syntax. 3.11 is covered by the test matrix.
python_version = "3.12"
strict = true
files = ["src"]
